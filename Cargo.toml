[workspace]
resolver = "2"
members = ["crates/must-gather", "crates/retry"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/glennswest/stormgather"

# Zero build warnings (stormcentral#193): a warning fails the build.
[workspace.lints.rust]
warnings = "deny"

[profile.release]
lto = true
strip = "debuginfo"
