[package]
name = "stormgather-retry"
description = "One retry helper (stormcos_qa#57): bounded backoff with jitter under a deadline, attempts logged, infrastructure failures told apart from real answers. Used by must-gather and by stormcos_qa's tests"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "retry"

[lints]
workspace = true

[dependencies]
anyhow = "1"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
tokio = { version = "1", features = ["net", "io-util"] }
